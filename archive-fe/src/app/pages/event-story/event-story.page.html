<section class="catalog">
  <p-breadcrumb [home]="breadcrumbHome" [model]="breadcrumbItems" styleClass="!p-0 mb-4" />
  @if (event; as collection) {
    <h1 class="mb-4 break-words text-3xl font-semibold [overflow-wrap:anywhere]">
      {{ collection.label }}
    </h1>
    @if (auth.user()) {
      <a
        pButton
        severity="secondary"
        class="my-4 w-fit"
        [routerLink]="['/add-transcript']"
        [queryParams]="{ eventName: collection.label, category: 'event-story' }"
      >
        <i class="pi pi-plus" aria-hidden="true"></i>
        <span>{{ language.text('addStage') }}</span>
      </a>
    }
    <div class="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
      @for (stage of collection.stages; track stage.id) {
        <a
          pButton
          class="min-h-10 w-full !justify-start !text-left whitespace-normal px-3 py-2"
          [routerLink]="['/event-story', slug(collection.label), slug(stage.label)]"
        >
          {{ stage.label }}
        </a>
      }
    </div>
  } @else {
    <h1 class="mb-4 break-words text-3xl font-semibold [overflow-wrap:anywhere]">
      {{ language.text('eventNotFound') }}
    </h1>
  }
</section>
