<section class="catalog">
  <p-breadcrumb [home]="breadcrumbHome" [model]="breadcrumbItems" styleClass="!p-0" />
  <h1 class="mb-4 break-words text-3xl font-semibold [overflow-wrap:anywhere]">{{ characterName }}</h1>
  @if (auth.user()) {
    <p-confirmdialog key="perspectra-character-actions" [style]="{ width: 'min(28rem, calc(100vw - 2rem))' }" />
    <div class="flex flex-wrap gap-2">
      <button pButton type="button" severity="secondary" (click)="editCharacter()">
        <i class="pi pi-pencil" aria-hidden="true"></i>
        <span>{{ language.text('editCharacter') }}</span>
      </button>
      <button pButton type="button" severity="danger" (click)="deleteCharacter()">
        <i class="pi pi-trash" aria-hidden="true"></i>
        <span>{{ language.text('deleteCharacter') }}</span>
      </button>
      <a
        pButton
        severity="secondary"
        [routerLink]="['/add-transcript']"
        [queryParams]="{ category: 'perspectra', parentLabel: characterName }"
      >
        <i class="pi pi-plus" aria-hidden="true"></i>
        <span>{{ language.text('addChapter') }}</span>
      </a>
    </div>
  }
  <p-dialog
    [header]="language.text('renameCharacter')"
    [(visible)]="renameDialogVisible"
    [modal]="true"
    [draggable]="false"
    [style]="{ width: 'min(28rem, calc(100vw - 2rem))' }"
  >
    <div class="flex flex-col gap-4">
      <label class="font-medium" for="perspectra-character-name">{{ language.text('characterName') }}</label>
      <input pInputText id="perspectra-character-name" [(ngModel)]="renameValue" class="w-full" />
      <div class="flex justify-end gap-2">
        <button pButton type="button" severity="secondary" (click)="cancelRename()">
          <i class="pi pi-times" aria-hidden="true"></i>
          <span>{{ language.text('cancel') }}</span>
        </button>
        <button pButton type="button" (click)="saveRename()">
          <i class="pi pi-check" aria-hidden="true"></i>
          <span>{{ language.text('save') }}</span>
        </button>
      </div>
    </div>
  </p-dialog>
  <div class="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
    @for (chapter of chapters; track chapter.id) {
      <a
        pButton
        class="min-h-10 w-full !justify-start !text-left whitespace-normal px-3 py-2"
        [routerLink]="['/perspectra', character, chapter.id]"
      >
        {{ chapter.label }}
      </a>
    } @empty {
      <p>{{ language.text('noChapters') }}</p>
    }
  </div>
</section>
