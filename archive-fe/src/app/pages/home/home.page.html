<section class="cards grid gap-4 md:grid-cols-2">
  @for (x of links; track x.path) {
    <a
      [routerLink]="x.path"
      class="group block rounded-lg outline-none transition-transform duration-200 hover:-translate-y-1 focus-visible:ring-2 focus-visible:ring-[var(--p-primary-color)]"
    >
      <p-card class="archive-category-card overflow-hidden transition-shadow duration-200 group-hover:shadow-lg group-focus-visible:shadow-lg">
        <ng-template #header>
          <div class="relative aspect-[16/9] w-full overflow-hidden">
            <p-image
              [src]="x.image"
              [alt]="language.text(x.key)"
              [preview]="false"
              styleClass="block h-full w-full"
              imageClass="h-full w-full object-cover transition-transform duration-200 group-hover:scale-105"
            />
            <span
              class="absolute inset-0 transition-colors duration-200 group-hover:bg-black/25 group-focus-visible:bg-black/25"
              aria-hidden="true"
            ></span>
            <span
              class="absolute inset-0 z-10 flex items-center justify-center text-center text-2xl font-semibold uppercase tracking-wide text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.85)]"
            >{{ language.text(x.key) }}</span>
          </div>
        </ng-template>
      </p-card>
    </a>
  }
</section>
