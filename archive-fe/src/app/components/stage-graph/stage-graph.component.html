<div class="flex flex-col gap-3">
  <div
    class="stage-viewport rounded-lg border border-[var(--p-content-border-color)] bg-[var(--p-content-hover-background)] p-2"
    [class.is-dragging]="isDragging"
    (pointerdown)="startDragging($event)"
    (pointermove)="drag($event)"
    (pointerup)="endDragging($event)"
    (pointercancel)="endDragging($event)"
    (pointerleave)="endDragging($event)"
  >
    <div class="stage-map" [style.width.px]="mapWidth" [style.height.px]="mapHeight">
      <svg
        class="stage-graph"
        [attr.width]="mapWidth"
        [attr.height]="mapHeight"
        [attr.viewBox]="'0 0 ' + mapWidth + ' ' + mapHeight"
        preserveAspectRatio="none"
        role="img"
        [attr.aria-label]="title"
      >
        @for (edge of edges; track edge.id) {
          <path
            [attr.d]="edgePath(edge)"
            fill="none"
            stroke="var(--p-primary-color)"
            stroke-width="2"
          />
        }
      </svg>
      <div class="stage-node-layer">
        @for (node of nodes; track node.id) {
          <button
            type="button"
            class="stage-node flex items-center justify-center p-3 text-center font-semibold shadow-sm"
            [style.left.px]="nodeX(node) - nodeWidth / 2"
            [style.top.px]="nodeY(node) - nodeHeight / 2"
            [style.width.px]="nodeWidth"
            [style.height.px]="nodeHeight"
            (pointerdown)="$event.stopPropagation()"
            (click)="openStage($event, node.link)"
          >
            <span class="stage-node-content relative z-10">
              <span class="stage-number">{{ node.stageNumber }}</span>
              @if (node.stageName) {
                <span class="stage-name">{{ node.stageName }}</span>
              }
            </span>
          </button>
        }
      </div>
    </div>
  </div>
</div>
