spring.application.name=archive-be
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/archive_db}
spring.datasource.username=${DATABASE_USERNAME:archive_user}
spring.datasource.password=${DATABASE_PASSWORD:change-this-password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
